<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RMiner: A Benchmark for Dexterous Robotic Manipulation in Mining Environments"
    />
    <title>RMiner</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #10100e;
        color: #f4f1e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 20% 15%, rgba(218, 154, 64, 0.14), transparent 30rem),
          radial-gradient(circle at 85% 85%, rgba(116, 95, 60, 0.12), transparent 28rem),
          #10100e;
      }

      main {
        width: min(960px, calc(100% - 40px));
        padding: 72px 0;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 20px;
        color: #d9a34f;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 900px;
        margin: 0 auto;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.7rem, 7vw, 5.8rem);
        font-weight: 600;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      h1 span {
        display: block;
        margin-bottom: 18px;
        color: #e2a84d;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 0.58em;
        font-weight: 800;
        letter-spacing: -0.055em;
      }

      .divider {
        width: 72px;
        height: 2px;
        margin: 42px auto 30px;
        background: linear-gradient(90deg, transparent, #d9a34f, transparent);
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .link-card {
        min-width: 160px;
        padding: 15px 22px;
        border: 1px solid rgba(244, 241, 232, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.035);
      }

      .link-card strong {
        display: inline-block;
        margin-right: 8px;
        font-size: 0.92rem;
      }

      .link-card small {
        color: #aaa69c;
        font-size: 0.74rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      footer {
        margin-top: 38px;
        color: #77746d;
        font-size: 0.78rem;
      }

      @media (max-width: 560px) {
        main {
          padding: 48px 0;
        }

        .links {
          align-items: stretch;
          flex-direction: column;
        }

        .link-card {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Project Page</p>
      <h1>
        <span>RMiner</span>
        A Benchmark for Dexterous Robotic Manipulation in Mining Environments
      </h1>

      <div class="divider" aria-hidden="true"></div>

      <ul class="links" aria-label="Project resources">
        <li class="link-card"><strong>arXiv</strong><small>Coming Soon</small></li>
        <li class="link-card"><strong>GitHub</strong><small>Coming Soon</small></li>
        <li class="link-card"><strong>Dataset</strong><small>Coming Soon</small></li>
      </ul>

      <footer>More project materials will be released soon.</footer>
    </main>
  </body>
</html>
